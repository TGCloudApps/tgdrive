[package]
name = "tgdrive"
version = "0.1.0"
description = "Drive pessoal sobre o Telegram"
authors = ["Felipe"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the binary (cargo#8519).
name = "tgdrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-tg-controller = { path = "../../crates/tg-controller" }
tg-core = { path = "../../crates/tg-core" }
tg-app = { path = "../../crates/tg-app" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "macros", "io-util", "time", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
mime_guess = "2"
sha2 = "0.10"
axum = { version = "0.7", default-features = false, features = ["json"] }
